<svg xmlns="http://www.w3.org/2000/svg" width="800" height="458" viewBox="0 0 800 458" role="img" aria-labelledby="title desc">
<title id="title">Gronify terminal demo: count matches, cap matches with full paths, and compare two JSON files with diff</title>
<desc id="desc">Real output from gronify 1.3.2.
$ gronify search events.json --count error
4

$ gronify search events.json -m 3 error
json.events[1].level = &quot;error&quot;
json.events[3].level = &quot;error&quot;
json.events[5].level = &quot;error&quot;
Stopped after 3 matches (--max-count); there may be more

$ diff &lt;(gronify flatten --sort old.json) &lt;(gronify flatten --sort new.json)
3c3
&lt; json.service.image = &quot;checkout:1.4.0&quot;
---
&gt; json.service.image = &quot;checkout:1.5.0&quot;
5c5
&lt; json.service.replicas = 2
---
&gt; json.service.replicas = 3</desc>
