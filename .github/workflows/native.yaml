name: Native experiment

on:
  push:
    branches: [main]
    paths: ["native/**", "src/packages/cli/**", ".github/workflows/native.yaml"]
  pull_request:
    paths: ["native/**", "src/packages/cli/**", ".github/workflows/native.yaml"]

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - name: Check Rust formatting
        run: cargo +1.97.0 fmt --manifest-path native/Cargo.toml -- --check
      - name: Lint Rust
        run: cargo +1.97.0 clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - name: Test boundaries and I/O
        run: cargo +1.97.0 test --release --locked --manifest-path native/Cargo.toml -- --test-threads=1
      - name: Build native CLI
        run: cargo +1.97.0 build --release --locked --manifest-path native/Cargo.toml
      - name: Build Node compatibility oracle
        working-directory: src/packages/cli
        run: npm ci --no-audit --no-fund && npm run build
      - name: Compare CLI behavior
        run: |
          python3 native/scripts/compat.py
          python3 native/scripts/search_compat.py
          python3 native/scripts/unflatten_compat.py
