name: Release

# Pushes to main run release-please, which keeps a release PR open from
# conventional commits under src/packages/cli. Merging that PR bumps the
# version, tags vX.Y.Z and creates the GitHub release; the jobs below then
# attach the binary archives (used by the Homebrew formula) and publish to
# npm when the NPM_TOKEN secret is configured.
#
# Pushing a v* tag by hand still builds and publishes that tag.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs['src/packages/cli--release_created'] }}
      tag_name: ${{ steps.release.outputs['src/packages/cli--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          # A PAT lets CI run on the release PR; GITHUB_TOKEN works but
          # pull requests it opens don't trigger other workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  artifacts:
    name: Build release artifacts
    needs: release-please
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/v') ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
    concurrency:
      group: release-artifacts-${{ needs.release-please.outputs.tag_name || github.ref_name }}
    outputs:
      tag: ${{ env.TAG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Verify release version
        working-directory: src/packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "$TAG"

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: src/packages/cli
        run: npm ci

      - name: Check, build, and test
        working-directory: src/packages/cli
        run: |
          npm run lint
          npm run format:check
          npm run build:bundle
          npm test
          test "$(node dist/gronify --version)" = "${TAG#v}"

      - name: Package release artifacts
        working-directory: src/packages/cli
        run: |
          mkdir release
          chmod +x dist/gronify
          cp LICENSE release/ 2>/dev/null || cp ../../../LICENSE release/
          cp ../../../README.md release/
          tar -czf "gronify-${TAG}.tar.gz" -C release . -C ../dist gronify
          zip -j "gronify-${TAG}.zip" dist/gronify ../../../README.md ../../../LICENSE
          sha256sum "gronify-${TAG}.tar.gz" "gronify-${TAG}.zip" > checksums.txt

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src/packages/cli
        run: |
          assets=("gronify-${TAG}.tar.gz" "gronify-${TAG}.zip" checksums.txt)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${assets[@]}"
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG" "${assets[@]}"
          fi

  npm-publish:
    name: Publish to npm
    needs: artifacts
    if: always() && needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.artifacts.outputs.tag }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check for NPM_TOKEN
        id: token
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not set; skipping npm publish."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.enabled == 'true'
        with:
          ref: ${{ env.TAG }}

      - name: Use Node.js
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: src/packages/cli/package-lock.json

      - name: Build package
        if: steps.token.outputs.enabled == 'true'
        working-directory: src/packages/cli
        run: |
          npm ci
          npm run build
          cp ../../../README.md ../../../LICENSE .

      - name: Publish
        if: steps.token.outputs.enabled == 'true'
        working-directory: src/packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already on npm; skipping."
            exit 0
          fi
          npm publish --provenance --access public
