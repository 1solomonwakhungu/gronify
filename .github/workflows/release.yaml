name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        working-directory: src/packages/cli
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install fastgron
        run: |
          curl --fail --location --output fastgron https://github.com/adamritter/fastgron/releases/download/v0.7.7/fastgron-ubuntu
          chmod +x fastgron
          sudo mv fastgron /usr/local/bin/

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: src/packages/cli/package-lock.json

      - name: Install dependencies
        working-directory: src/packages/cli
        run: npm ci

      - name: Check, build, and test
        working-directory: src/packages/cli
        run: |
          npm run lint
          npm run format:check
          npm run build:bundle
          npm test
          test "$(node dist/gronify --version)" = "${GITHUB_REF_NAME#v}"

      - name: Package release artifacts
        working-directory: src/packages/cli
        run: |
          mkdir release
          chmod +x dist/gronify
          cp LICENSE release/ 2>/dev/null || cp ../../../LICENSE release/
          cp ../../../README.md release/
          tar -czf "gronify-${GITHUB_REF_NAME}.tar.gz" -C release . -C ../dist gronify
          zip -j "gronify-${GITHUB_REF_NAME}.zip" dist/gronify ../../../README.md ../../../LICENSE
          sha256sum "gronify-${GITHUB_REF_NAME}.tar.gz" "gronify-${GITHUB_REF_NAME}.zip" > checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: src/packages/cli
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"
          "gronify-${GITHUB_REF_NAME}.tar.gz"
          "gronify-${GITHUB_REF_NAME}.zip"
          checksums.txt
